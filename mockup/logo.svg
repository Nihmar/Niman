<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>Copist</title>
  <desc>Clipboard with three text lines and a quill with a gold nib drawing an ink stroke, on a cream squircle.</desc>
  <defs>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="7"/>
      <feOffset dy="6" result="off"/>
      <feFlood flood-color="#5b4a2f" flood-opacity="0.22"/>
      <feComposite in2="off" operator="in" result="sh"/>
      <feMerge><feMergeNode in="sh"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="drop" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dy="4" result="off"/>
      <feFlood flood-color="#141c2a" flood-opacity="0.35"/>
      <feComposite in2="off" operator="in" result="sh"/>
      <feMerge><feMergeNode in="sh"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect width="512" height="512" fill="#f2ead9"/>
  <!-- squircle tile -->
  <rect x="40" y="40" width="432" height="432" rx="48" fill="#f9f3e6" filter="url(#soft)"/>

  <!-- clipboard -->
  <g filter="url(#drop)">
    <!-- board -->
    <rect x="142" y="119" width="210" height="275" rx="14" fill="none" stroke="#1f2b3e" stroke-width="17"/>
    <!-- seam behind the clip -->
    <g fill="#f9f3e6">
      <circle cx="247" cy="100" r="31"/>
      <rect x="191" y="94" width="112" height="68" rx="24"/>
    </g>
    <!-- clip: ring + tab -->
    <g fill="#1f2b3e">
      <circle cx="247" cy="100" r="26"/>
      <rect x="197" y="100" width="100" height="56" rx="20"/>
    </g>
    <circle cx="247" cy="100" r="12" fill="#f9f3e6"/>
    <!-- text lines -->
    <rect x="173" y="184" width="116" height="16" rx="8" fill="#1f2b3e"/>
    <rect x="173" y="227" width="97" height="16" rx="8" fill="#1f2b3e"/>
    <rect x="173" y="270" width="69" height="16" rx="8" fill="#1f2b3e"/>
  </g>

  <!-- quill -->
  <g filter="url(#drop)">
    <!-- feather: convex right edge, notched left edge, forked base -->
    <path d="M 438 136
             C 454 176 448 196 436 204
             L 422 210
             L 430 230
             C 424 262 390 310 318 344
             L 306 332
             L 296 346
             C 287 318 289 296 292 282
             L 304 286
             L 295 262
             C 299 250 301 244 302 238
             L 314 242
             L 305 216
             C 312 190 330 168 356 152
             C 388 144 416 138 438 136
             Z" fill="#1f2b3e"/>
    <!-- rachis -->
    <path d="M 432 148 C 416 210 372 280 308 330"
          fill="none" stroke="#f9f3e6" stroke-width="7" stroke-linecap="round"/>
    <!-- nib -->
    <path d="M 301 339 L 317 359 L 247 396 L 259 349 Z" fill="#d9b36a"/>
    <circle cx="272" cy="364" r="6" fill="#f9f3e6"/>
    <!-- ink stroke -->
    <path d="M 247 396 C 252 407 264 412 282 410 C 306 408 326 396 344 379"
          fill="none" stroke="#1f2b3e" stroke-width="7" stroke-linecap="round"/>
  </g>
</svg>
