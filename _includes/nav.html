<header class="site-header">
  <div class="site-header__inner">
    <a class="brand" href="{{ site.baseurl }}/" aria-label="{{ site.title }}, back to the start">
      <img class="brand__mark" src="{{ site.baseurl }}/logos/svg/niman-mark.svg" alt="" width="26" height="26">
      <span class="brand__name">{{ site.title }}</span>
    </a>
    <nav class="site-nav" aria-label="Primary">
      <a class="site-nav__link{% if page.url contains '/docs/' %} is-current{% endif %}" href="{{ site.baseurl }}/docs/"{% if page.url contains '/docs/' %} aria-current="true"{% endif %}>Guides</a>
      <a class="site-nav__link" href="https://github.com/Nihmar/Niman/releases">Download</a>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch between the light and dark theme" aria-pressed="false">
        <svg class="theme-toggle__icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
          <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.75"></circle>
          <path d="M12 3a9 9 0 0 0 0 18Z" fill="currentColor"></path>
        </svg>
      </button>
    </nav>
  </div>
</header>
