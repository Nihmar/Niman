<h1>冬の畑</h1>
<p>冬の畑は空っぽではありません。ケール、ネギ、パースニップが寒さに耐え、それぞれが少しの手入れを求めます。北風の日には覆いをかけ、根元には藁を敷き、土が固まらないように通路をきれいに保ちます。</p>
<p>霜は害よりも益をもたらします。パースニップを甘くし、秋に掘り返した土の塊を砕き、春の芽を待つナメクジの一部を減らしてくれます。冬の畑の仕事は、七月の種まきから始まるのです。</p>
<p>一番日の短い頃は、眺めるほかにすることはあまりありません。それにも意味があります。何も隠すもののない今こそ畝の形がよく分かり、今つけた記録が来年の計画を決めるのです。</p>
