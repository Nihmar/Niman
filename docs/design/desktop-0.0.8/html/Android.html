<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Niman on Android — the open-notes switcher</title>
<style>
body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,sans-serif;background:#1B1D21;color:#F2EDE5}
a{color:#7CA0E6}a:hover{color:#9FB8EE}
button{font-family:inherit;border:0;background:none;color:inherit;cursor:pointer;padding:0}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; background: #1B1D21; overflow: hidden; display: flex; flex-direction: column;">

  <div style="height: 60px; flex-shrink: 0; display: flex; align-items: center; padding: 0 6px; gap: 2px;">
    <button aria-label="Back" style="width: 46px; height: 46px; border-radius: 23px; color: #E3DED6; display: flex; align-items: center; justify-content: center;"><svg width="21" height="21" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><line x1="13" y1="8" x2="3" y2="8"/><polyline points="7,4 3,8 7,12"/></svg></button>
    <div style="flex-grow: 1; min-width: 0; padding-left: 4px;">
      <div style="font-size: 16px; font-weight: 600; color: #F2EDE5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Colazione di venerdì</div>
      <div style="font-size: 12px; color: #A6A29A;">Lists</div>
    </div>
    <button aria-label="Open notes, 3 open" style="position: relative; width: 46px; height: 46px; border-radius: 23px; color: #E3DED6; display: flex; align-items: center; justify-content: center;">
      <svg width="21" height="21" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><rect x="2.5" y="5.5" width="11" height="11" rx="2"/><path d="M6 5.5V4a1.5 1.5 0 0 1 1.5-1.5h9A1.5 1.5 0 0 1 18 4v9a1.5 1.5 0 0 1-1.5 1.5H15"/></svg>
      <span style="position: absolute; top: 4px; right: 3px; min-width: 16px; height: 16px; border-radius: 8px; background: #587CD3; color: #FFFFFF; font-size: 10.5px; font-weight: 700; display: flex; align-items: center; justify-content: center; padding: 0 4px;">3</span>
    </button>
    <button aria-label="More" style="width: 46px; height: 46px; border-radius: 23px; color: #E3DED6; display: flex; align-items: center; justify-content: center;"><svg width="19" height="19" viewBox="0 0 16 16" fill="currentColor"><circle cx="8" cy="3" r="1.4"/><circle cx="8" cy="8" r="1.4"/><circle cx="8" cy="13" r="1.4"/></svg></button>
  </div>

  <div style="flex-grow: 1; min-height: 0; padding: 8px 20px 0 20px;">
    <p style="margin: 0 0 16px 0; font-size: 15px; line-height: 1.6; color: #E3DED6;">Ordine del gruppo, raccolto ieri sera. I totali si rifanno con Tools.</p>
    <div style="display: flex; align-items: center; gap: 11px; height: 40px;"><svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="#8FBF7F" stroke-width="1.5"><rect x="2" y="2" width="12" height="12" rx="2.5"/></svg><span style="font-size: 15px; color: #E3DED6;">cappuccino: 4</span></div>
    <div style="display: flex; align-items: center; gap: 11px; height: 40px;"><svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="#8FBF7F" stroke-width="1.5"><rect x="2" y="2" width="12" height="12" rx="2.5"/></svg><span style="font-size: 15px; color: #E3DED6;">brioche: 7</span></div>
    <div style="display: flex; align-items: center; gap: 11px; height: 40px;"><svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="#8FBF7F" stroke-width="1.5" stroke-linejoin="round"><rect x="2" y="2" width="12" height="12" rx="2.5" fill="#8FBF7F"/><polyline points="5,8.2 7.2,10.4 11,5.9" stroke="#1B1D21" stroke-width="1.8"/></svg><span style="font-size: 15px; color: #A6A29A; text-decoration: line-through;">acqua naturale: 2</span></div>
  </div>

  <div style="position: absolute; inset: 0; background: rgba(12, 13, 15, 0.58);"></div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; background: #2C3037; border-radius: 22px 22px 0 0; box-shadow: 0 -12px 40px rgba(0,0,0,0.5); padding-bottom: 14px;">
    <div style="display: flex; justify-content: center; padding: 10px 0 4px 0;"><span style="width: 34px; height: 4px; border-radius: 2px; background: #4A4F59; display: block;"></span></div>

    <div style="display: flex; align-items: center; padding: 8px 20px 12px 20px;">
      <h2 style="margin: 0; font-size: 16px; font-weight: 650; color: #F2EDE5;">Open notes</h2>
      <span style="font-size: 13px; color: #A6A29A; padding-left: 8px;">3</span>
      <div style="flex-grow: 1;"></div>
      <button style="height: 36px; padding: 0 12px; border-radius: 18px; font-size: 13.5px; color: #7CA0E6;">Close all</button>
    </div>

    <div style="display: flex; align-items: center; gap: 14px; height: 60px; padding: 0 20px; background: #363B44; border-left: 3px solid #587CD3;">
      <svg width="20" height="20" viewBox="0 0 16 16" fill="none" stroke="#587CD3" stroke-width="1.4" stroke-linejoin="round"><path d="M3 2.5h6l4 4v7a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1v-10a1 1 0 0 1 1-1z"/><polyline points="9,2.5 9,6.5 13,6.5"/></svg>
      <div style="flex-grow: 1; min-width: 0;">
        <div style="font-size: 15px; color: #F2EDE5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Colazione di venerdì</div>
        <div style="font-size: 12px; color: #A6A29A;">Lists</div>
      </div>
      <button aria-label="Close Colazione di venerdì" style="width: 44px; height: 44px; border-radius: 22px; color: #A6A29A; display: flex; align-items: center; justify-content: center;"><svg width="15" height="15" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="2.5" y1="2.5" x2="9.5" y2="9.5"/><line x1="9.5" y1="2.5" x2="2.5" y2="9.5"/></svg></button>
    </div>

    <div style="display: flex; align-items: center; gap: 14px; height: 60px; padding: 0 20px;">
      <svg width="20" height="20" viewBox="0 0 16 16" fill="none" stroke="#A6A29A" stroke-width="1.4" stroke-linejoin="round"><path d="M3 2.5h6l4 4v7a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1v-10a1 1 0 0 1 1-1z"/><polyline points="9,2.5 9,6.5 13,6.5"/></svg>
      <div style="flex-grow: 1; min-width: 0;">
        <div style="font-size: 15px; color: #E3DED6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Enciclopedia</div>
        <div style="font-size: 12px; color: #A6A29A;">Notes4</div>
      </div>
      <span style="width: 7px; height: 7px; border-radius: 4px; background: #D8A56B; display: block; margin-right: 6px;"></span>
      <button aria-label="Close Enciclopedia" style="width: 44px; height: 44px; border-radius: 22px; color: #A6A29A; display: flex; align-items: center; justify-content: center;"><svg width="15" height="15" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="2.5" y1="2.5" x2="9.5" y2="9.5"/><line x1="9.5" y1="2.5" x2="2.5" y2="9.5"/></svg></button>
    </div>

    <div style="display: flex; align-items: center; gap: 14px; height: 60px; padding: 0 20px;">
      <svg width="20" height="20" viewBox="0 0 16 16" fill="none" stroke="#A6A29A" stroke-width="1.4" stroke-linejoin="round"><path d="M3 2.5h6l4 4v7a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1v-10a1 1 0 0 1 1-1z"/><polyline points="9,2.5 9,6.5 13,6.5"/></svg>
      <div style="flex-grow: 1; min-width: 0;">
        <div style="font-size: 15px; color: #E3DED6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">todo.txt</div>
        <div style="font-size: 12px; color: #A6A29A;">Notes4</div>
      </div>
      <button aria-label="Close todo.txt" style="width: 44px; height: 44px; border-radius: 22px; color: #A6A29A; display: flex; align-items: center; justify-content: center;"><svg width="15" height="15" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="2.5" y1="2.5" x2="9.5" y2="9.5"/><line x1="9.5" y1="2.5" x2="2.5" y2="9.5"/></svg></button>
    </div>

    <div style="height: 1px; background: #4A4F59; margin: 8px 20px;"></div>

    <div style="display: flex; align-items: center; gap: 14px; height: 52px; padding: 0 20px;">
      <svg width="20" height="20" viewBox="0 0 16 16" fill="none" stroke="#7CA0E6" stroke-width="1.5"><line x1="8" y1="3" x2="8" y2="13"/><line x1="3" y1="8" x2="13" y2="8"/></svg>
      <span style="font-size: 15px; color: #7CA0E6;">New note</span>
    </div>
  </div>
</div>
</body>
</html>
