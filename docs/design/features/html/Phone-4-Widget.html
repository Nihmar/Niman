<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Android home screen, Todos widget off</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=Literata:opsz,wght@7..72,400;7..72,600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#7CA0E6}a:hover{color:#A9C0F0}
.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.fill{fill:currentColor;stroke:none}
.sub{font-size:13px;color:#A6A29A}
.lab{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:#A6A29A}
.mono{font-family:'IBM Plex Mono',monospace;font-size:.95em}
.tree{display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;border-radius:8px;font-size:13.5px;color:#D9D4CB;white-space:nowrap}
.tree.sel{background:#363B44;color:#F2EDE5}
.tab{display:flex;align-items:center;gap:8px;height:30px;padding:0 10px 0 13px;border-radius:7px;font-size:13px;color:#C8C3BA}
.tab.on{background:#383D46;color:#F2EDE5}
.railbtn{width:38px;height:38px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#A6A29A}
.railbtn.on{background:#363B44;color:#587CD3}
.ibtn{width:32px;height:32px;border-radius:8px;border:0;background:transparent;color:#A6A29A;display:flex;align-items:center;justify-content:center;padding:0;flex:none}
.ibtn.on{background:#363B44;color:#F2EDE5}
.obtn{height:32px;padding:0 12px;border-radius:16px;border:1px solid #4A4F59;background:transparent;color:#F2EDE5;font:500 13px 'IBM Plex Sans',sans-serif;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.tbtn{height:32px;padding:0 10px;border-radius:16px;border:0;background:transparent;color:#A9C0F0;font:500 13px 'IBM Plex Sans',sans-serif;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.fbtn{height:32px;padding:0 18px;border-radius:16px;border:0;background:#587CD3;color:#F2EDE5;font:500 13px 'IBM Plex Sans',sans-serif;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
/* the switch: Material 3, 52x32 */
.sw{width:52px;height:32px;box-sizing:border-box;border-radius:16px;position:relative;flex:none;display:block;border:2px solid #8C9099;background:transparent}
.sw::before{content:'';position:absolute;top:50%;left:6px;width:16px;height:16px;margin-top:-8px;border-radius:50%;background:#A6A29A}
.sw.on{background:#587CD3;border-color:#587CD3}
.sw.on::before{left:20px;width:24px;height:24px;margin-top:-12px;background:#F2EDE5}
.sw svg{position:absolute;left:24px;top:50%;width:16px;height:16px;margin-top:-8px;fill:none;stroke:#3A4A6E;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.sw.dis{opacity:.38}
/* a feature row */
.card{background:#2C3037;border-radius:14px;overflow:hidden}
.glab{font-size:12px;line-height:14px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:#A6A29A;margin:12px 16px 5px}
.frow{position:relative;display:flex;align-items:center;gap:14px;padding:6px 16px;min-height:44px;box-sizing:border-box;border-bottom:1px solid #23262B}
.frow:last-child{border-bottom:0}
.frow .lead{color:#A6A29A}
.frow .t{flex:1;min-width:0;line-height:17px;font-size:14px}
.frow .t .sub{font-size:12.5px;line-height:15px}
.frow.child{padding-left:46px}
.frow.child::before{content:'';position:absolute;left:25px;top:0;height:50%;width:12px;border-left:1.5px solid #4A4F59;border-bottom:1.5px solid #4A4F59;border-bottom-left-radius:7px}
.frow.dis .t,.frow.dis .lead{color:#6B7079}
.frow.dis .t .sub{color:#6B7079}
.tag{display:inline-block;margin-left:6px;padding:0 6px;border:1px solid #4A4F59;border-radius:6px;font-size:11px;font-weight:500;line-height:16px;color:#A6A29A;vertical-align:1px}
/* presets */
.chips{display:flex;align-items:center;gap:8px}
.chip{height:34px;box-sizing:border-box;padding:0 14px;border-radius:17px;border:1px solid #4A4F59;display:inline-flex;align-items:center;gap:6px;font:500 13px 'IBM Plex Sans',sans-serif;color:#D9D4CB;white-space:nowrap;flex:none}
.chip.on{background:#3A4A6E;border-color:#3A4A6E;color:#F2EDE5}
.chip.dis{opacity:.38}
.snack{position:absolute;background:#363B44;border-radius:14px;padding:0 8px 0 18px;height:48px;display:flex;align-items:center;gap:12px;box-shadow:0 10px 30px rgba(0,0,0,.45);box-sizing:border-box;z-index:9}
.snack .msg{flex:1;font-size:14px;color:#F2EDE5}
.snack .act{font-size:14px;font-weight:600;color:#7CA0E6;padding:0 10px}

.ico{width:22px;height:22px}
.ibtn{width:44px;height:44px;border-radius:22px;color:#D9D4CB}
.obtn{height:40px;padding:0 16px;border-radius:20px;font-size:14px;gap:8px}
.tbtn{height:40px;padding:0 12px;border-radius:20px;font-size:14px;gap:8px}
.fbtn{height:40px;padding:0 20px;border-radius:20px;font-size:14px;gap:8px}
.glab{margin:18px 20px 6px}
.frow{gap:12px;padding:8px 12px 8px 16px;min-height:56px}
.frow .t{font-size:15px}
.frow .t .sub{font-size:12.5px;line-height:1.35;margin-top:1px}
.frow.child{padding-left:42px}
.frow.child::before{left:24px}
.chip{height:40px;padding:0 16px;border-radius:20px;font-size:14px}
.snack{left:12px;right:12px;bottom:36px;height:auto;min-height:56px;padding:10px 6px 10px 16px}
.snack .msg{font-size:14px;line-height:1.4}

.app{display:flex;flex-direction:column;align-items:center;gap:6px;width:72px}
.app .ic{width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.14);color:#F2EDE5}
.app .nm{font-size:12px;color:#F2EDE5;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.widget{margin:0 12px;background:#2C3037;border-radius:28px;color:#F2EDE5;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.wh{display:flex;align-items:center;gap:8px;padding:14px 18px 0;font-size:13px;color:#A6A29A}
.wh b{font-weight:600;color:#F2EDE5}
</style>
</head>
