<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Folder grid, phone empty folder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=Literata:opsz,wght@7..72,400;7..72,600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;padding:28px;font-family:'IBM Plex Sans',sans-serif;background:#14161A;color:#F2EDE5}
.ico{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
.phone{width:360px;height:780px;background:#23262B;color:#F2EDE5;font-size:15px;overflow:hidden;display:flex;flex-direction:column;position:relative;border-radius:18px;box-shadow:0 0 0 1px #363B44}
.status{height:24px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-size:12px;color:#D9D4CB}
.appbar{height:64px;flex:none;display:flex;align-items:center;padding:0 4px 0 16px}
.appbar .title{flex:1;font-size:22px}
.ab{width:44px;height:48px;display:flex;align-items:center;justify-content:center;color:#A6A29A;position:relative}
.badge{position:absolute;top:8px;right:6px;min-width:16px;height:16px;border-radius:8px;background:#E0687A;color:#F2EDE5;font-size:11px;line-height:16px;text-align:center;font-weight:500}
.crumbs{height:44px;flex:none;display:flex;align-items:center;gap:1px;padding:0 10px 0 4px;border-bottom:1px solid #363B44;font-size:14px;box-sizing:border-box;white-space:nowrap;overflow:hidden}
.upb{width:40px;height:40px;border-radius:20px;display:flex;align-items:center;justify-content:center;color:#A6A29A;flex:none}
.cr{padding:6px 6px;color:#A6A29A;flex:none}
.cr.cur{color:#F2EDE5;font-weight:500}
.sep{color:#6B7079;font-size:13px;flex:none}
.grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:8px;align-content:start;overflow:hidden}
.tile{position:relative;height:124px;border-radius:8px;display:flex;flex-direction:column;align-items:center;padding:12px 6px 8px;box-sizing:border-box;min-width:0}
.tile .ic{height:40px;display:flex;align-items:center;justify-content:center;margin-bottom:6px}
.tile .nm{font-size:13px;line-height:17px;text-align:center;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;max-width:100%}
.tile .dt{font-size:11.5px;color:#A6A29A;margin-top:auto}
.tile.sel{background:rgba(204,204,204,.10)}
.tile.held{background:rgba(242,237,229,.10)}
.tile.side{color:#A6A29A}
.tile.side .nm{font-size:12.5px}
.tile .pinb{position:absolute;top:7px;right:7px;color:#F2EDE5}
.fab{position:absolute;right:16px;bottom:96px;width:56px;height:56px;border-radius:16px;background:#363B44;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 8px rgba(0,0,0,.4);color:#F2EDE5}
.nav{height:80px;flex:none;background:#2C3037;display:flex;align-items:flex-start;padding-top:12px;box-sizing:border-box}
.nd{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;color:#A6A29A;min-width:0}
.nd .pill{width:52px;height:32px;border-radius:16px;display:flex;align-items:center;justify-content:center}
.nd.on{color:#F2EDE5;font-weight:500}
.nd.on .pill{background:#363B44}
.nd span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:58px}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.54);z-index:4}
.menu{position:absolute;background:#2C3037;border-radius:4px;padding:8px 0;box-shadow:0 6px 24px rgba(0,0,0,.5);z-index:5;font-size:14px}
.mi{height:48px;display:flex;align-items:center;gap:12px;padding:0 16px 0 12px;white-space:nowrap}
.mh{height:30px;display:flex;align-items:flex-end;padding:0 16px 4px 12px;font-size:12px;color:#A6A29A;font-weight:500;letter-spacing:.04em}
.msep{height:1px;background:#363B44;margin:7px 0 8px}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#2C3037;border-radius:28px 28px 0 0;padding:10px 0 12px;z-index:5}
.handle{width:32px;height:4px;border-radius:2px;background:#4A4F59;margin:0 auto 4px}
.li{height:56px;display:flex;align-items:center;gap:16px;padding:0 24px 0 16px;font-size:16px}
.li .ico{color:#A6A29A}
.li.danger,.li.danger .ico{color:#E0687A}
.lsep{height:1px;background:#363B44;margin:0 16px}
</style>
</head>
<body>
<div class="phone"><div class="status"><span>9:41</span><span style="display:flex;gap:6px;align-items:center"><span style="font-size:11px">87%</span></span></div><div class="appbar"><div class="title">Files</div><span class="ab" title="Open notes"><svg class="ico" viewBox="0 0 24 24" style="width:22px;height:22px;" aria-hidden="true"><rect x="7" y="3" width="14" height="14" rx="1.2"/><path d="M3 7v13a1 1 0 0 0 1 1h13"/></svg><span class="badge">2</span></span><span class="ab" title="Journal"><svg class="ico" viewBox="0 0 24 24" style="width:22px;height:22px;" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="1.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg></span><span class="ab" title="Sync"><svg class="ico" viewBox="0 0 24 24" style="width:22px;height:22px;" aria-hidden="true"><path d="M7 18.5h10.5a4 4 0 0 0 .6-7.95A6 6 0 0 0 6.6 9.1 4.75 4.75 0 0 0 7 18.5z"/><path d="M9.5 13.5l2 2 3.5-3.5"/></svg></span><span class="ab" title="Trash"><svg class="ico" viewBox="0 0 24 24" style="width:22px;height:22px;" aria-hidden="true"><path d="M5 7h14M9.5 7V4.5h5V7M7 7l.9 12.1a1 1 0 0 0 1 .9h6.2a1 1 0 0 0 1-.9L17 7M10.5 11v5M13.5 11v5"/></svg></span><span class="ab" title="Sort"><svg class="ico" viewBox="0 0 24 24" style="width:22px;height:22px;" aria-hidden="true"><path d="M7.5 9.5L12 5l4.5 4.5M7.5 14.5L12 19l4.5-4.5"/></svg></span></div><div class="crumbs"><span class="upb" title="Up (Alt+Up)"><svg class="ico" viewBox="0 0 24 24" style="width:18px;height:18px;" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg></span><span class="cr">Library</span><span class="sep">›</span><span class="cr">Projects</span><span class="sep">›</span><span class="cr">Niman</span><span class="sep">›</span><span class="cr cur">Meetings</span></div><div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:0 40px 90px;text-align:center"><svg class="ico" viewBox="0 0 24 24" style="width:48px;height:48px;color:#6B7079;stroke-width:1.3;" aria-hidden="true"><path d="M3 18V7a1.5 1.5 0 0 1 1.5-1.5h4.3l2 2h7.7A1.5 1.5 0 0 1 20 9v1.5"/><path d="M3 18l2.6-6.6A1.5 1.5 0 0 1 7 10.5h13.2a1 1 0 0 1 .9 1.4l-2.5 6.7a1.5 1.5 0 0 1-1.4.9H4.5A1.5 1.5 0 0 1 3 18z"/></svg><div style="font-size:16px;color:#D9D4CB;margin-top:6px">Nothing in Meetings yet</div><div style="font-size:13.5px;line-height:1.5;color:#A6A29A">Tap + to make a note or a folder here.</div></div><div class="fab"><svg class="ico" viewBox="0 0 24 24" style="width:24px;height:24px;" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></div><div class="nav"><div class="nd on"><div class="pill"><svg class="ico" viewBox="0 0 24 24" style="width:22px;height:22px;" aria-hidden="true"><path d="M3 7a1.5 1.5 0 0 1 1.5-1.5h4.3l2 2h8.7A1.5 1.5 0 0 1 21 9v9a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18z" fill="currentColor"/></svg></div><span>Files</span></div><div class="nd"><div class="pill"><svg class="ico" viewBox="0 0 24 24" style="width:22px;height:22px;" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 12.2l2.8 2.8 5.7-5.7"/></svg></div><span>Todo</span></div><div class="nd"><div class="pill"><svg class="ico" viewBox="0 0 24 24" style="width:22px;height:22px;" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/></svg></div><span>Search</span></div><div class="nd"><div class="pill"><svg class="ico" viewBox="0 0 24 24" style="width:22px;height:22px;" aria-hidden="true"><path d="M4 10.5L12 4l8 6.5V20h-5.5v-5.5h-5V20H4z"/></svg></div><span>Home</span></div><div class="nd"><div class="pill"><svg class="ico" viewBox="0 0 24 24" style="width:22px;height:22px;" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13 7l4 4"/></svg></div><span>Quick note</span></div><div class="nd"><div class="pill"><svg class="ico" viewBox="0 0 24 24" style="width:22px;height:22px;" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2.8l1.6 2.5 2.9-.7.7 2.9 2.5 1.6-1.4 2.6 1.4 2.6-2.5 1.6-.7 2.9-2.9-.7L12 21.2l-1.6-2.5-2.9.7-.7-2.9-2.5-1.6L5.7 12 4.3 9.4l2.5-1.6.7-2.9 2.9.7z"/></svg></div><span>Settings</span></div></div></div>
</body>
</html>
