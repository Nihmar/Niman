<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Todo desktop, filtered by priority</title>
</head>
<body>
<style>
body{margin:0}
.app{width:100%;min-height:900px;background:#dfe2ea;color:#2b2e36;font-family:"Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column;font-size:14px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.sm{width:14px;height:14px}
.tb{height:38px;display:flex;align-items:center;gap:6px;padding:0 6px;color:#4a4f5c;font-size:12px;flex:none}
.tbb{width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:6px}
.rail{width:44px;display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:6px;color:#4a4f5c;flex:none}
.rb{width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:8px}
.pane{flex:1;min-width:0;background:#eff1f5;border-radius:8px 0 0 0;padding:12px 16px 24px}
.col{max-width:900px;margin:0 auto}
.pill{height:32px;border:1px solid #b9bec9;border-radius:16px;padding:0 12px;display:inline-flex;align-items:center;gap:6px;font-size:13px;color:#2b2e36;white-space:nowrap}
.pill.on{background:#e2dcf7;border-color:#8b5cf6;color:#5b21b6}
.chip{height:28px;border-radius:14px;padding:0 6px 0 10px;display:inline-flex;align-items:center;gap:6px;font-size:13px;background:#e2dcf7;color:#3b2a74}
.qa{display:flex;align-items:center;gap:10px;height:40px;border:1px solid #b9bec9;border-radius:6px;padding:0 12px;margin:10px 0 8px;color:#6a6f7c;background:#f4f5f8}
.sec{display:flex;align-items:center;gap:6px;width:100%;height:34px;padding:0 10px 0 6px;box-sizing:border-box;font-size:12px;font-weight:600;color:#5d6270;margin-top:6px}
.sec .k{flex:1;text-align:left}
.row{display:flex;align-items:center;gap:10px;height:40px;padding:0 6px 0 10px;border-radius:6px}
.cb{width:16px;height:16px;border:1.5px solid #7d8290;border-radius:3px;flex:none;background:#fff;display:flex;align-items:center;justify-content:center;box-sizing:border-box}
.cb.done{background:#7c3aed;border-color:#7c3aed;color:#fff}
.tx{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.d .tx{color:#6a6f7c;text-decoration:line-through}
.mt{display:flex;align-items:center;gap:10px;font-size:12px;color:#5d6270;white-space:nowrap}
.mt span{display:inline-flex;align-items:center;gap:4px}
.more{width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:6px;color:#4a4f5c}
.p{color:#2f62c4}
</style>
<div class="app">
  <div class="tb">
    <button class="tbb" aria-label="Toggle sidebar"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M10 5v14"/></svg></button>
    <span style="padding:0 60px 0 10px">2026-10-07</span>
    <button class="tbb" aria-label="New tab"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
    <button class="tbb" aria-label="Tab list"><svg class="i sm" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
    <div style="flex:1"></div>
    <span style="display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 8px 0 10px;border:1px solid #8b5cf6;border-radius:6px;color:#2b2e36"><svg class="i sm" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="m8 12 3 3 5-6"/></svg>Tasks<svg class="i sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></span>
    <button class="tbb" aria-label="Menu"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <button class="tbb" aria-label="Minimize"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 17h12"/></svg></button>
    <button class="tbb" aria-label="Maximize"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="1"/></svg></button>
    <button class="tbb" aria-label="Close"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>
  <div style="flex:1;display:flex">
    <nav class="rail" aria-label="Main">
      <button class="rb" aria-label="Home"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20h-5v-6h-6v6H4z"/></svg></button>
      <button class="rb" aria-label="Files"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5H9l2 2h8.5A1.5 1.5 0 0 1 21 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5z"/></svg></button>
      <button class="rb" aria-label="Tasks" aria-current="page" style="background:#d2cdea;color:#7c3aed"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2" fill="#7c3aed"/><path d="m8 12 3 3 5-6" stroke="#ffffff"/></svg></button>
      <button class="rb" aria-label="Quick note"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg></button>
      <button class="rb" aria-label="Search"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg></button>
    </nav>
    <main class="pane">
      <div class="col">
        <div style="display:flex;align-items:center;gap:8px">
          <button class="pill on"><svg class="i sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16l-6 7.5V19l-4-2v-4.5z"/></svg>Filter · 1<svg class="i sm" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
          <button class="pill"><svg class="i sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v16M3 8l4-4 4 4M17 20V4M13 16l4 4 4-4"/></svg>Priority<svg class="i sm" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
          <div style="flex:1"></div>
          <button style="display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px;color:#7c3aed;font-weight:600;font-size:13px"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Add task</button>
          <button class="more" aria-label="Format help" style="width:32px;height:32px"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .9-1 1.7"/><path d="M12 17h.01"/></svg></button>
        </div>
        <div style="display:flex;align-items:center;gap:10px;margin-top:10px">
          <button class="chip" aria-label="Remove filter +casa">+casa<svg class="i sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
          <span style="font-size:12px;color:#5d6270;flex:1">3 of 6</span>
          <button style="height:28px;padding:0 8px;font-size:13px;font-weight:600;color:#7c3aed">Clear</button>
        </div>
        <div class="qa"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><label for="qa2" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">New task</label><input id="qa2" placeholder="Add a task — +project @context due:" style="flex:1;border:0;background:none;font:inherit;font-size:14px;color:#2b2e36;outline:none"></div>

        <button class="sec" aria-expanded="true"><svg class="i sm" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg><span class="k">Priority A</span><span>1</span></button>
        <div class="row"><span class="cb"></span><span class="tx">Pagare bollo auto</span><span class="mt"><span class="p">+casa</span><span style="color:#2f62c4">Today</span></span><span class="more"></span></div>
        <button class="sec" aria-expanded="true"><svg class="i sm" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg><span class="k">Priority B</span><span>1</span></button>
        <div class="row"><span class="cb"></span><span class="tx">Sistemare tapparella</span><span class="mt"><span class="p">+casa</span><span>Tue 20 Oct</span></span><span class="more"></span></div>
        <button class="sec" aria-expanded="true"><svg class="i sm" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg><span class="k">No priority</span><span>1</span></button>
        <div class="row"><span class="cb"></span><span class="tx">Comprare lampadine</span><span class="mt"><span class="p">+casa</span></span><span class="more"></span></div>

        <button class="sec" aria-expanded="true" style="margin-top:14px;height:42px;border-top:1px solid #d3d6de;font-size:13px;color:#3d4250"><svg class="i sm" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg><span class="k">Done</span><span style="color:#5d6270">4</span></button>
        <div class="row d"><span class="cb done"><svg class="i sm" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg></span><span class="tx">Comprare detersivo</span><span class="mt"><span class="p">+casa</span><span>Done 14 Oct</span></span><span class="more"></span></div>
        <div class="row d"><span class="cb done"><svg class="i sm" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg></span><span class="tx">Pulire grondaia</span><span class="mt"><span class="p">+casa</span><span>Done 12 Oct</span></span><span class="more"></span></div>
        <div class="row d"><span class="cb done"><svg class="i sm" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg></span><span class="tx">Chiamare idraulico</span><span class="mt"><span class="p">+casa</span><span>Done 9 Oct</span></span><span class="more"></span></div>
        <div class="row d"><span class="cb done"><svg class="i sm" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg></span><span class="tx">Cambiare filtro caldaia</span><span class="mt"><span class="p">+casa</span><span>Done 2 Oct</span></span><span class="more"></span></div>
      </div>
    </main>
  </div>
</div>
</body>
</html>
