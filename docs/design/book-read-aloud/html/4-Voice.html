<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Lettura ad alta voce — voce e velocità</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Literata:opsz,wght@7..72,400;7..72,600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1A5FB4}a:hover{color:#134a8c}
.opt{display:flex;align-items:center;gap:12px;min-height:52px;padding:0 8px 0 4px;border-radius:10px;cursor:pointer}
.opt:hover{background:#F1F2F4}
.opt input{width:20px;height:20px;margin:0 6px;accent-color:#1A5FB4}
.hear{width:44px;height:44px;border:0;border-radius:22px;background:transparent;color:#3C4043;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.hear:hover{background:#E6E7EA}
.wide{display:flex;align-items:center;justify-content:center;gap:8px;height:44px;border:1px solid #C4C7CC;border-radius:22px;background:#FFFFFF;color:#123F78;font:500 14px Inter,system-ui,sans-serif;cursor:pointer}
.wide:hover{background:#F1F2F4}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; background: #FFFFFF; font-family: Inter, system-ui, sans-serif; color: #1F1F1F; overflow: hidden">
  <div aria-hidden="true" style="position: absolute; inset: 0; padding: 80px 24px 0; font-family: Literata, Georgia, serif; font-size: 18px; line-height: 1.62; color: #24262A">
    <p style="margin: 0 0 14px">C’era una volta…</p>
    <p style="margin: 0 0 14px">— Un re! — diranno subito i miei piccoli lettori.</p>
    <p style="margin: 0 0 14px">No, ragazzi, avete sbagliato. C’era una volta un pezzo di legno.</p>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(20,22,26,0.42)"></div>
  <section role="dialog" aria-label="Voce e velocità" style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; border-radius: 22px 22px 0 0; padding: 10px 16px 20px; display: flex; flex-direction: column; gap: 14px">
    <div style="align-self: center; width: 36px; height: 4px; border-radius: 2px; background: #C4C7CC" aria-hidden="true"></div>
    <h3 style="margin: 0; font-size: 18px; font-weight: 600">Voce e velocità</h3>
    <div style="display: flex; flex-direction: column; gap: 2px">
      <div style="font-size: 12px; font-weight: 600; color: #5F6368; text-transform: uppercase; letter-spacing: 0.04em">Lingua</div>
      <div style="font-size: 15px">Italiano <span style="color: #5F6368">· dal libro</span></div>
    </div>
    <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px">
      <legend style="padding: 0 0 6px; font-size: 12px; font-weight: 600; color: #5F6368; text-transform: uppercase; letter-spacing: 0.04em">Voce</legend>
      <div style="display: flex; align-items: center">
        <label class="opt" style="flex: 1"><input type="radio" name="voice" checked="checked"><span style="display: flex; flex-direction: column"><span style="font-size: 15px">Voce A</span><span style="font-size: 12px; color: #5F6368">sul dispositivo</span></span></label>
        <button class="hear" aria-label="Ascolta la voce A"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9zM16.5 8.5a5 5 0 010 7"></path></svg></button>
      </div>
      <div style="display: flex; align-items: center">
        <label class="opt" style="flex: 1"><input type="radio" name="voice"><span style="display: flex; flex-direction: column"><span style="font-size: 15px">Voce B</span><span style="font-size: 12px; color: #5F6368">sul dispositivo</span></span></label>
        <button class="hear" aria-label="Ascolta la voce B"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9zM16.5 8.5a5 5 0 010 7"></path></svg></button>
      </div>
      <div style="display: flex; align-items: center">
        <label class="opt" style="flex: 1"><input type="radio" name="voice"><span style="display: flex; flex-direction: column"><span style="font-size: 15px">Voce C</span><span style="font-size: 12px; color: #5F6368">richiede la rete</span></span></label>
        <button class="hear" aria-label="Ascolta la voce C"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9zM16.5 8.5a5 5 0 010 7"></path></svg></button>
      </div>
    </fieldset>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="speed" style="display: flex; justify-content: space-between; font-size: 12px; font-weight: 600; color: #5F6368; text-transform: uppercase; letter-spacing: 0.04em"><span>Velocità</span><span style="color: #1F1F1F; text-transform: none; letter-spacing: 0; font-size: 14px">1,25×</span></label>
      <input id="speed" type="range" min="0.5" max="2" step="0.25" value="1.25" style="width: 100%; accent-color: #1A5FB4; height: 32px; margin: 0">
      <div style="display: flex; justify-content: space-between; font-size: 12px; color: #5F6368" aria-hidden="true"><span>0,5×</span><span>1×</span><span>2×</span></div>
    </div>
    <button class="wide"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 01-1 1H5a1 1 0 01-1-1V7a1 1 0 011-1h5"></path></svg>Impostazioni di sintesi vocale di Android</button>
  </section>
</div>
</body>
</html>
