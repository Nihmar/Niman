name: copist
description: "Copist — a multiplatform Markdown note-taking app."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none'

# The following defines the version and build number for your application.
# Both the version and the build number may be overridden by flutter
# build by specifying --build-name and --build-number, respectively.
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  # Rebuildable index (SQLite + FTS5); schema lands in M1.
  crypto: ^3.0.7
  drift: ^2.34.3

  dynamic_color: ^2.1.0
  file_picker: ^12.2.0
  flutter:
    sdk: flutter

  # Preview rendering: code highlighting.
  flutter_highlight: ^0.7.0

  # Preview rendering: Markdown.
  # State management (Flutter integration).
  flutter_local_notifications: ^22.3.0

  # Flutter's own widget strings (date/time pickers, the selection menu)
  # in the app's language.
  flutter_localizations:
    sdk: flutter

  flutter_markdown_plus: ^1.0.12
  flutter_riverpod: ^3.4.3

  # OS secure storage for credentials and the encryption key (M5/M6).
  flutter_secure_storage: ^11.0.0

  # Pure-Dart KaTeX for math; spec coverage is verified in M2.
  flutter_smooth_markdown: 0.8.1

  # The highlighter core behind flutter_highlight, used directly by the
  # preview's code highlighter (lang rules, parse).
  flutter_timezone: ^5.1.0
  highlight: ^0.7.0

  katex: ^1.0.0
  katex_dart: ^0.1.1

  # The Markdown parser core behind flutter_markdown_plus (AST + GFM and
  # footnote syntax), used directly by the windowed preview.
  markdown: ^7.3.1
  # Filesystem location for the library root.
  meta: ^1.19.0
  path: ^1.9.1
  path_provider: ^2.1.6

  # Source editor widget (Reqable's large-text editor): caret, selection,
  # IME/composition, handles and scrolling come from the package instead of
  # the former hand-built editor stack. Highlighting is Copist's incremental
  # tokenizer (editor/highlighting.dart) wired through the controller's
  # spanBuilder — NOT the package's whole-file codeTheme engine.
  re_editor: ^0.10.0

  # State management (app-wide).
  riverpod: ^3.4.3

  # The SQLite the index runs on, bundled with the app. Android and Linux
  # have a system libsqlite3 that drift's NativeDatabase can open; Windows
  # ships no sqlite3.dll, so without this the app builds and then dies on
  # its first index query.
  #
  # sqlite3 3.x bundles the native library itself, through Dart build
  # hooks that fetch a prebuilt binary. That replaced the old
  # platform-specific build scripts, so `sqlite3_flutter_libs` is gone —
  # its 0.6.0 release is an empty package that exists only to say so.
  # Consequence to remember: the first build on a machine needs network.
  sqlite3: ^3.5.2
  timezone: ^0.11.1
  url_launcher: ^6.3.2

  # The frontmatter block is real YAML (M4): the hand-rolled key:value
  # reader could not do nested maps, block lists or quoting rules, and a
  # note that opens fine in another editor must not read as garbage here.
  yaml: ^3.1.3

dev_dependencies:
  build_runner: ^2.16.0
  drift_dev: ^2.34.5
  flutter_test:
    sdk: flutter

  integration_test:
    sdk: flutter

  # Strict lint set for the whole project.
  very_good_analysis: ^11.0.0

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Placeholder branding; replaced by the real asset pipeline in M7.
  assets:
    - assets/branding/
