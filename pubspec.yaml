name: niman
description: "Niman — a multiplatform Markdown note-taking app."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none'

# The following defines the version and build number for your application.
# Both the version and the build number may be overridden by flutter
# build by specifying --build-name and --build-number, respectively.
version: 0.0.9+6

environment:
  sdk: ^3.13.2

dependencies:
  # The EPUB reader (lib/src/epub/): an EPUB is a zip. Already there
  # through pdfrx; direct since the reader opens books itself.
  archive: ^4.3.0
  audioplayers: ^6.8.1

  # The sync's automatic triggers: Wi-Fi only, and a retry as soon as the
  # network comes back (docs/records/sync.md, "Queue and triggers").
  connectivity_plus: ^7.3.1
  crypto: ^3.0.7
  desktop_drop: ^0.8.4

  # Rebuildable index (SQLite + FTS5); schema lands in M1.
  drift: ^2.34.3

  # The device's own colors, for the Material You palette (T-M6-05).
  dynamic_color: ^2.1.0

  # Dart FFI: the hunspell desktop spell-check engine (T-PP-09).
  ffi: ^2.1.1

  file_picker: ^12.2.0
  flutter:
    sdk: flutter

  # State management (Flutter integration).
  flutter_local_notifications: ^22.3.0

  # Flutter's own widget strings (date/time pickers, the selection menu)
  # in the app's language.
  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^3.4.3

  # OS secure storage for credentials and the encryption key (M5/M6).
  flutter_secure_storage: ^11.0.0

  flutter_timezone: ^5.1.0
  # The code lexer (D2 of docs/records/unified-surface.md): its grammars colour
  # a fence by its language; the drawing is Niman's.
  highlight: ^0.7.0

  home_widget: ^0.9.4
  # The EPUB reader's chapters and navigation document: XHTML as a
  # browser parses it, forgiving of the markup real books ship.
  html: ^0.15.7

  # The math typesetter (katex_dart: TeX to boxes) and its painter and KaTeX
  # fonts (katex). Kept through phase 5 (#247): a typesetter of Niman's own
  # is 8-12k lines for a start, and these render the geometry note right.
  katex: ^1.0.0
  katex_dart: ^0.1.1

  # The CommonMark/GFM parser (D2 of docs/records/unified-surface.md): the
  # unified engine walks its AST.
  markdown: ^7.3.1
  # Filesystem location for the library root.
  meta: ^1.19.0

  # The desktop tray (T-PP-06b) — the one surface window_manager dropped
  # (no TrayManager in 0.5.x), same leanflutter family. Used for the tray
  # only: its `WindowManager` is hidden at the import and `getCurrent()`
  # is never called, since window_manager owns the window. Exact pin:
  # pre-1.0 with a moving API. Its vendored C++ compiles into every
  # platform build, the Android APK included (accepted in the T-PP-16
  # verdict; see the Risks section of plan/m-platform-parity.md).
  nativeapi: 0.2.4

  package_info_plus: ^10.2.1
  path: ^1.9.1
  path_provider: ^2.1.6

  # The attachment viewer's PDFs (lib/src/ui/attachment_view.dart): PDFium,
  # bundled on Android, Linux and Windows through Dart build hooks, as
  # sqlite3 is below — the first build on a machine needs network.
  pdfrx: ^2.6.5
  record: ^7.1.1

  # State management (app-wide).
  riverpod: ^3.4.3

  # The SQLite the index runs on, bundled with the app. Android and Linux
  # have a system libsqlite3 that drift's NativeDatabase can open; Windows
  # ships no sqlite3.dll, so without this the app builds and then dies on
  # its first index query.
  #
  # sqlite3 3.x bundles the native library itself, through Dart build
  # hooks that fetch a prebuilt binary. That replaced the old
  # platform-specific build scripts, so `sqlite3_flutter_libs` is gone —
  # its 0.6.0 release is an empty package that exists only to say so.
  # Consequence to remember: the first build on a machine needs network.
  sqlite3: ^3.5.2
  timezone: ^0.11.1
  url_launcher: ^6.3.2

  # On-device speech-to-text (whisper.cpp) for the audio notes'
  # "Trascrivi" action. Pulls ffmpeg_kit_flutter_new_min on Android;
  # on desktop it only reads 16 kHz mono PCM16 WAV unless `ffmpeg` is on
  # PATH, so clips are converted before they reach it.
  whisper_ggml: ^2.6.0

  # The desktop window is owned by this package (T-PP-16 spike winner):
  # the only candidate with a runtime-verified close-request event, which
  # the dirty-check on close (T-PP-11) rides, plus a real Linux drag.
  # Exact pin: leanflutter's pre-1.0 line with a moving API (the spike
  # notes in plan/m-platform-parity.md record the three-way evaluation).
  window_manager: 0.5.2

  # WebDAV multistatus parsing (M5 sync): servers choose their own
  # namespace prefixes, which a hand-rolled reader gets wrong.
  xml: ^7.0.1

  # The frontmatter block is real YAML (M4): the hand-rolled key:value
  # reader could not do nested maps, block lists or quoting rules, and a
  # note that opens fine in another editor must not read as garbage here.
  yaml: ^3.1.3

dev_dependencies:
  build_runner: ^2.16.0
  drift_dev: ^2.34.5
  fake_async: ^1.3.3
  flutter_test:
    sdk: flutter

  integration_test:
    sdk: flutter

  # Strict lint set for the whole project.
  very_good_analysis: ^11.0.0

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Placeholder branding; replaced by the real asset pipeline in M7.
  assets:
    - assets/branding/
    - CHANGELOG.md
    # Literata's license travels with the font (SIL OFL 1.1).
    - assets/fonts/literata/OFL.txt

  # The reading face the books can be set in (#280): Literata, by the
  # Literata Project Authors, under the SIL Open Font License 1.1.
  fonts:
    - family: Literata
      fonts:
        - asset: assets/fonts/literata/Literata-Regular.ttf
        - asset: assets/fonts/literata/Literata-Italic.ttf
          style: italic
        - asset: assets/fonts/literata/Literata-Bold.ttf
          weight: 700
        - asset: assets/fonts/literata/Literata-BoldItalic.ttf
          weight: 700
          style: italic
