name: release

# Tag-only releases: pushing a tag vX.Y.Z builds every artifact and publishes
# it on the tag's GitHub Release page. Branch pushes and pull requests build
# nothing. How to cut a release is documented in README "Release".
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.2'

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "error: tag must be vX.Y.Z (got $GITHUB_REF_NAME)" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Release signing key (optional)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            cat > android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/release.jks
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          storePassword=$ANDROID_STORE_PASSWORD
          EOF
            echo "Signing with the release key."
          else
            echo "No signing secrets: APK is debug-signed (see plan T-M7-02)."
          fi

      # whisper_ggml builds whisper.cpp with NDK 29, which is still
      # r29-beta1: sdkmanager only offers the stable channel by default,
      # so the Gradle plugin's own install of it fails with "sdkmanager
      # did not install NDK 29.0.13113456". Fetch it from the beta
      # channel first. Drop this once the plugin moves to a stable NDK.
      - name: Android NDK (beta channel)
        run: |
          NDK="$(grep -oP 'ndkVersion\s*=\s*"\K[^"]+' android/app/build.gradle.kts)"
          echo "installing ndk;$NDK"
          # No pipefail here: sdkmanager exits before `yes` does, `yes`
          # dies of SIGPIPE with 141, and under pipefail that sinks the
          # step even though the install worked. The directory check
          # below is what actually says whether it did.
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --channel=1 "ndk;$NDK"
          if [ ! -d "$ANDROID_HOME/ndk/$NDK" ]; then
            echo "error: ndk;$NDK is not under $ANDROID_HOME/ndk" >&2
            ls -1 "$ANDROID_HOME/ndk" 2>/dev/null >&2 || true
            exit 1
          fi

      - run: flutter pub get
      # The official flavor (issue #106): AGP drops the no-flavor
      # variant once the channel dimension has a flavor, so the
      # official APK is built from the explicit flavor.
      - run: flutter build apk --release --flavor official --build-name="$VERSION" --build-number="$GITHUB_RUN_NUMBER"

      - name: Stage artifact
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-official-release.apk "dist/niman-$VERSION-android.apk"

      # The testing build (issue #106): the release pipeline with the
      # beta flavor's separate application ID (dev.niman.niman.beta),
      # installable side by side with the official APK.
      - run: flutter build apk --release --flavor beta --dart-define=APP_CHANNEL=testing --build-name="$VERSION" --build-number="$GITHUB_RUN_NUMBER"

      - name: Stage testing artifact
        run: cp build/app/outputs/flutter-apk/app-beta-release.apk "dist/niman-$VERSION-android-testing.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: dist/niman-*-android.apk

  linux:
    name: Linux tarball, AppImage, Arch pkg
    runs-on: ubuntu-24.04 # GLib 2.80: nativeapi needs G_APPLICATION_DEFAULT_FLAGS (2.74+)
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake git ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-13-dev \
            libayatana-appindicator3-dev libsecret-1-dev libjsoncpp-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "error: tag must be vX.Y.Z (got $GITHUB_REF_NAME)" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - run: flutter pub get
      - run: flutter build linux --release --build-name="$VERSION" --build-number="$GITHUB_RUN_NUMBER"

      - name: Linux tarball (bundle + icon)
        run: |
          mkdir -p dist tarstage
          cp -a build/linux/x64/release/bundle tarstage/bundle
          cp assets/branding/app_icon.png tarstage/dev.niman.niman.png
          tar -czf "dist/niman-$VERSION-linux-x64.tar.gz" -C tarstage bundle dev.niman.niman.png

      - name: AppImage
        run: |
          bash packaging/appimage/make-appimage.sh \
            build/linux/x64/release/bundle \
            assets/branding/app_icon.png \
            "$VERSION" \
            "dist/niman-$VERSION-linux-x64.AppImage"

      - name: Arch package
        run: |
          STAGE="$PWD/pkgstage"
          mkdir -p "$STAGE"
          cp packaging/linux/PKGBUILD "$STAGE/"
          cp "dist/niman-$VERSION-linux-x64.tar.gz" \
            "$STAGE/niman-$VERSION-linux-x64.tar.gz"
          sed -i "s/^pkgver=.*/pkgver=$VERSION/" "$STAGE/PKGBUILD"
          # makepkg refuses root: build as an unprivileged user inside Arch.
          # The tarball is already next to the PKGBUILD, so its https source
          # is reused instead of downloaded.
          docker run --rm -v "$STAGE:/pkg" -w /pkg archlinux:latest bash -c '
            set -e
            # makepkg checks the PKGBUILD runtime depends and errors when
            # they are absent; install them (plus base-devel) up front.
            pacman -Sy --noconfirm --needed base-devel \
              gtk3 libsecret libayatana-appindicator >/dev/null
            useradd -m builder
            chown -R builder:builder /pkg
            su builder -c "cd /pkg && makepkg --noconfirm"
          '
          # makepkg ran as the container's unprivileged user, so the
          # outputs are owned by that uid; sudo to move them on the host.
          sudo mv "$STAGE"/niman-*.pkg.tar.zst dist/

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/niman-*-linux-x64.tar.gz
            dist/niman-*-linux-x64.AppImage
            dist/niman-*.pkg.tar.zst

  windows:
    name: Windows installer (Inno Setup)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Version from tag
        shell: pwsh
        run: |
          $v = $env:GITHUB_REF_NAME.TrimStart('v')
          if ($v -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$') {
            Write-Error "tag must be vX.Y.Z (got $env:GITHUB_REF_NAME)"
            exit 1
          }
          "VERSION=$v" >> $env:GITHUB_ENV

      - run: flutter pub get
      - name: Build Windows bundle
        shell: bash
        run: flutter build windows --release --build-name="$VERSION" --build-number="$GITHUB_RUN_NUMBER"

      # A clean Windows has no Visual C++ runtime (#35): the bundle must
      # carry it, or niman.exe does not start there. windows/CMakeLists.txt
      # installs it; this keeps a release from shipping without it.
      - name: Check the bundled Visual C++ runtime
        shell: pwsh
        run: |
          $missing = @('msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') |
            Where-Object { -not (Test-Path "build\windows\x64\runner\Release\$_") }
          if ($missing) {
            Write-Error "bundle lacks the VC++ runtime: $($missing -join ', ')"
            exit 1
          }

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' `
            "packaging\windows\niman.iss" "/DAppVersion=$env:VERSION"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Portable zip
        shell: pwsh
        run: |
          Compress-Archive -Path 'build\windows\x64\runner\Release\*' `
            -DestinationPath "dist\niman-$env:VERSION-windows-x64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/niman-*-windows-x64-setup.exe
            dist/niman-*-windows-x64.zip

  github-release:
    name: Publish GitHub Release
    needs: [android, linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Build release notes
        # GitHub's auto-generated notes only list merged PRs, which hides
        # everything pushed directly to main (perf fixes included). Build the
        # notes from the full commit range instead, grouped by type.
        run: |
          CUR="${GITHUB_REF_NAME}"
          PREV="$(git describe --tags --abbrev=0 "${CUR}^")"
          RANGE="${PREV}..${CUR}"
          section() {
            local filter="$1" title="$2" lines
            lines="$(git log "$RANGE" --format='%s' | grep -E "$filter" | sed 's/^/- /')"
            if [ -n "$lines" ]; then
              printf '## %s\n%s\n\n' "$title" "$lines"
            fi
          }
          {
            section '^perf' 'Performance'
            section '^feat' 'Features'
            section '^fix' 'Fixes'
            others="$(git log "$RANGE" --format='%s' | grep -E '^.+:' | grep -Ev '^(perf|feat|fix)' | sed 's/^/- /')"
            if [ -n "$others" ]; then
              printf '## Other\n%s\n\n' "$others"
            fi
            echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV}...${CUR}"
          } > notes.md

      - name: Release title from the changelog
        # The first line of the version's section that is neither a `###`
        # heading nor a bullet is the release's title; `Niman <version>`
        # when the section has none (see docs/dev/releasing.md).
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          TITLE="$(awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && index($0, "## [") == 1 { exit }
            found && $0 ~ /^[[:space:]]*$/ { next }
            found && $0 ~ /^[[:space:]]*###/ { next }
            found && $0 ~ /^[[:space:]]*[-*] / { next }
            found { print; exit }
          ' CHANGELOG.md | sed -E 's/^[*_[:space:]]+//; s/[*_[:space:]]+$//')"
          if [ -z "$TITLE" ]; then TITLE="Niman ${VERSION}"; fi
          echo "RELEASE_TITLE=${TITLE}" >> "$GITHUB_ENV"
          echo "release title: ${TITLE}"

      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.RELEASE_TITLE }}
          files: dist/*
          body_path: notes.md
