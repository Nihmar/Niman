name: dictionary-pack

# The dictionary packs the app downloads on demand (issue #1381,
# docs/records/dictionary.md): pushing a tag dictionary-pack-N builds every
# pack from wiktextract's extraction of Wiktionary (kaikki.org's raw dumps) with
# tool/dictionary_pack.dart and publishes them on that tag's release, as a
# PRERELEASE: the updater asks /releases/latest, which never answers with a
# prerelease, and release.yml only runs on v* tags. Never on a pull request:
# the dumps are 4.8 GB to download and the build takes hours.
#
# The app pins each archive's URL, size and SHA-256
# (lib/src/dictionary/dictionary_catalog.dart, generated by
# tool/dictionary_catalog.dart). This workflow generates that file and attaches
# it, with the per-pack reports, to the run; a new set of packs is a new tag
# and an app change that commits the file and points at it.
#
# Which languages are built from their own Wiktionary is the `--edition` list
# below. An own edition that does not meet the bar recorded in
# docs/records/dictionary.md ships English-glossed instead: delete its line
# here and its download above, and its pack is built from the English
# edition, which is read anyway.
on:
  push:
    tags:
      - 'dictionary-pack-*'

env:
  FLUTTER_VERSION: '3.47.2'
  KAIKKI: https://kaikki.org/dictionary

jobs:
  build:
    name: Build and publish the packs
    runs-on: ubuntu-latest
    timeout-minutes: 350
    # One job, so the archives (a gigabyte or more together) never travel
    # through an artifact: it builds and publishes, and writes to the
    # repository's releases only. The code it runs is the tagged checkout's.
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # A hosted runner has about 14 GB free: the dumps (4.8 GB gzipped, never
      # decompressed to disk), the sorts' spill files and the archives need
      # more at their peak. These are the preinstalled toolchains this job
      # does not use.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL
          df -h /

      # tool/dictionary_pack.dart runs under Dart, and the app's pubspec
      # needs the Flutter SDK to resolve; dictzip is for the check below.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: dictzip
        run: sudo apt-get update -q && sudo apt-get install -y -q dictzip

      # The English edition first: it is the biggest, and it serves the 23
      # packs glossed in English and the forms of the 12 own editions. The
      # editions are named <code>/<code>-extract.jsonl.gz on kaikki.org.
      - name: Download the dumps
        run: |
          mkdir -p raw
          curl -fL --retry 5 --retry-all-errors --retry-delay 10 \
            -o raw/en.jsonl.gz "$KAIKKI/raw-wiktextract-data.jsonl.gz"
          for code in fr de es pt zh ja it nl pl cs el tr; do
            curl -fL --retry 5 --retry-all-errors --retry-delay 10 \
              -o "raw/$code.jsonl.gz" \
              "$KAIKKI/downloads/$code/$code-extract.jsonl.gz"
          done
          ls -l raw
          df -h /

      # The streams are read from the gzip files; nothing is decompressed to
      # disk. --memory is what the sorts hold before they spill, and the Dart
      # heap takes about twice that. --archives-only drops each pack's folder
      # once it is in its tar.
      - name: Build the packs
        run: |
          dart run tool/dictionary_pack.dart \
            --out build/dictionary \
            --work "$RUNNER_TEMP/dictionary-work" \
            --english raw/en.jsonl.gz \
            --edition fr=raw/fr.jsonl.gz \
            --edition de=raw/de.jsonl.gz \
            --edition es=raw/es.jsonl.gz \
            --edition pt=raw/pt.jsonl.gz \
            --edition zh=raw/zh.jsonl.gz \
            --edition ja=raw/ja.jsonl.gz \
            --edition it=raw/it.jsonl.gz \
            --edition nl=raw/nl.jsonl.gz \
            --edition pl=raw/pl.jsonl.gz \
            --edition cs=raw/cs.jsonl.gz \
            --edition el=raw/el.jsonl.gz \
            --edition tr=raw/tr.jsonl.gz \
            --memory 2048 \
            --date "$(date -u +%F)" \
            --archives-only 2> build.log
          tail -n 40 build.log
          rm -rf raw
          df -h /
          ls -l build/dictionary

      # gzip reads a dictzip file as plain gzip, which checks its CRC; dictunzip
      # is the real dictzip reader, and reads it by chunks.
      - name: Check the archives
        run: |
          cd build/dictionary
          test "$(ls niman-*.tar | wc -l)" -eq 35
          for tar in niman-*.tar; do
            id="${tar%.tar}"
            test "$(tar -tf "$tar" | tr '\n' ' ')" = \
              "$id.ifo $id.idx $id.syn $id.dict.dz "
            tar -xOf "$tar" "$id.dict.dz" | gzip -t
          done
          tar -xOf niman-it.tar niman-it.dict.dz > "$RUNNER_TEMP/niman-it.dict.dz"
          dictunzip -c "$RUNNER_TEMP/niman-it.dict.dz" | wc -c \
            || echo "::warning::dictunzip could not read niman-it.dict.dz"
          sha256sum niman-*.tar | tee SHA256SUMS

      - name: Catalog
        run: |
          dart run tool/dictionary_catalog.dart build/dictionary "$GITHUB_REF_NAME"
          cp lib/src/dictionary/dictionary_catalog.dart build/dictionary/

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dictionary-reports
          path: |
            build/dictionary/*.report.json
            build/dictionary/report.txt
            build/dictionary/dictionary_catalog.dart
            build/dictionary/SHA256SUMS
            build.log

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: Dictionary packs ${{ github.ref_name }}
          prerelease: true
          make_latest: false
          body: >-
            Dictionary packs for the app's look-up, built by
            tool/dictionary_pack.dart from wiktextract's extraction of
            Wiktionary. Definitions by Wiktionary contributors, CC BY-SA 4.0
            and GFDL; extracted with wiktextract (Tatu Ylonen, "Wiktextract:
            Wiktionary as Machine-Readable Structured Data", LREC 2022). Not
            an app release.
          files: |
            build/dictionary/niman-*.tar
            build/dictionary/SHA256SUMS
