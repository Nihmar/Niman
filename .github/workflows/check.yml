name: check

# The tests run on every pull request so the integration suite cannot rot
# again unnoticed (issue #241). Everything a checkout can run runs here:
# the formatting gate, analyze, the unit and widget suites, and the
# integration files — the WebDAV sync flow included, on a virtual display
# (`flutter test -d linux` under xvfb). The freeze harness keeps its
# hand-seeded library and skips without it (issue #363).
on:
  pull_request:
  push:
    branches:
      - main

env:
  FLUTTER_VERSION: '3.47.2'

jobs:
  check:
    name: Format, analyze and test
    runs-on: ubuntu-latest
    # Read-only: analyze and test never touch the repository or a release.
    permissions:
      contents: read
    steps:
      # Actions are pinned to a commit SHA, with the tag in a comment: a
      # moving tag is a supply-chain hole (issue #393).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The integration steps build the Linux desktop bundle (`-d linux`
      # for the WebDAV flow), which needs the same system libraries as the
      # release build, plus a virtual display: the bundle is a GTK app and
      # cannot start on a runner with no X server.
      # hunspell is the spell-check engine the app ships on Linux and
      # Windows: without the library and the two dictionaries the live
      # cases in test/unit/spell_check_test.dart skip, and the engine
      # goes unexercised everywhere but a laptop (issue #363).
      # tesseract-ocr is the distribution's OCR engine, with its English
      # model: the live case of test/unit/ocr_engine_test.dart reads a
      # rendered page through it, the path a Linux install takes (#593).
      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake git ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-13-dev \
            libayatana-appindicator3-dev libsecret-1-dev libjsoncpp-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev xvfb \
            hunspell hunspell-en-us hunspell-it tesseract-ocr tesseract-ocr-eng

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      # AGENTS.md makes formatting a precondition of a commit; this is the
      # gate that keeps it one (issue #363). --output=none only reports.
      - name: Formatting gate
        run: dart format --output=none --set-exit-if-changed lib test tool
      - run: flutter analyze --fatal-infos
      - run: flutter test
      # One file per step: files under integration_test/ share one
      # device run, and a second file in the same command never starts.
      # xvfb-run stands in for the missing display: headless, but the
      # GTK bundle still needs an X server to start.
      - name: Headless integration tests
        run: xvfb-run -a flutter test integration_test/app_boot_test.dart
      - name: Repro harness (skips without its seeded library)
        run: xvfb-run -a flutter test integration_test/template_backlink_freeze_test.dart
      # The WebDAV flow (issue #20) binds the integration_test binding and
      # drives the real app over the Linux desktop bundle: it needs a
      # device, not only a display, so the headless steps above cannot run
      # it (#363).
      - name: WebDAV sync end to end (Linux desktop)
        run: xvfb-run -a flutter test integration_test/sync_e2e_test.dart -d linux

  # The JVM unit tests of the Android app module (android/app/src/test:
  # LaunchIntentTest, ShareCopyTest) ran nowhere: the job above never starts
  # Gradle, and the release build compiles the main sources only (#813).
  # A job of its own, so it runs alongside the Dart one.
  macos:
    name: macOS test and build
    # From phase 2 of docs/records/apple-platforms.md on, every pull request
    # runs on a Mac too (decision 12): the suites, a build of the app, and
    # the integration files, which run the real app as Linux's do.
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # ninja builds the OCR engine the app bundles (cmake is on the
      # image); tesseract brings the English model the live OCR case reads
      # with, through that engine (NIMAN_OCR_ENGINE) — the library a Mac
      # ships, not Homebrew's.
      - name: Build tools and the English OCR model
        run: brew install ninja tesseract

      - run: flutter pub get

      - name: OCR engine
        run: ./scripts/ocr-engine.sh macos-universal build/ocr-engine

      - name: Unit and widget tests
        env:
          NIMAN_OCR_ENGINE: ${{ github.workspace }}/build/ocr-engine/niman-ocr-macos-universal.dylib
        run: flutter test

      # The runner, the plugins' Swift and the Xcode build phases.
      - name: Build the beta app
        run: flutter build macos --debug --flavor beta --dart-define=APP_CHANNEL=testing

      # One file per step, as on Linux; a Mac needs no virtual display.
      - name: App boot
        run: flutter test integration_test/app_boot_test.dart
      - name: WebDAV sync end to end (macOS desktop)
        run: flutter test integration_test/sync_e2e_test.dart -d macos

  ios:
    name: iOS build and simulator
    # The iPhone app, beside the Mac's: its Swift and build phases, built
    # for a device unsigned, and the integration files run in a simulator.
    # The Dart suites are the Mac job's — they run on the host either way.
    runs-on: macos-26
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # ninja builds the OCR engine the simulator's app bundles.
      - name: Build tools
        run: brew install ninja

      - run: flutter pub get

      - name: OCR engine (simulator)
        run: ./scripts/ocr-engine.sh ios-sim-arm64 build/ocr-engine

      # The device's own architecture and SDK: Swift built for a simulator
      # only can hide what does not compile on an iPhone. Unsigned, and
      # without OCR, whose phase skips a missing engine with a warning.
      - name: Build the beta app for a device
        run: flutter build ios --debug --no-codesign --flavor beta --dart-define=APP_CHANNEL=testing

      - name: Boot an iPhone simulator
        run: |
          udid=$(xcrun simctl list devices available --json | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.name | startswith("iPhone"))][0].udid')
          xcrun simctl bootstatus "$udid" -b
          echo "SIMULATOR=$udid" >> "$GITHUB_ENV"

      # A run that never reaches the app sat silent for two hours once,
      # after the Xcode build: the steps have a ceiling, the tool's verbose
      # output goes to a file, and a failure prints its tail and the
      # simulator's own log.
      - name: App boot (iPhone simulator)
        timeout-minutes: 25
        run: flutter test integration_test/app_boot_test.dart -d "$SIMULATOR" --flavor beta -v > "$RUNNER_TEMP/app_boot.log" 2>&1
      - name: WebDAV sync end to end (iPhone simulator)
        timeout-minutes: 25
        run: flutter test integration_test/sync_e2e_test.dart -d "$SIMULATOR" --flavor beta -v > "$RUNNER_TEMP/sync_e2e.log" 2>&1
      - name: What the simulator runs said
        if: failure()
        run: |
          for log in "$RUNNER_TEMP"/app_boot.log "$RUNNER_TEMP"/sync_e2e.log; do
            [ -f "$log" ] && { echo "== $log"; tail -n 150 "$log"; }
          done
          echo "== simulator log"
          xcrun simctl spawn "$SIMULATOR" log show --last 30m --style compact \
            --predicate 'process == "Runner" OR subsystem == "com.apple.runningboard"' | tail -n 150

  android-unit:
    name: Android unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The Java the release build uses; `cache: gradle` keeps the wrapper
      # distribution and the dependencies between runs.
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Configuring :app asks for the app's NDK (ndkVersion) whatever the
      # task: the Gradle plugin installs it when missing, and NDK 29 is only
      # on sdkmanager's beta channel, so that install fails (reported as a
      # licence not accepted). release.yml's step, for the same reason; drop
      # both once whisper_ggml moves to a stable NDK.
      - name: Android NDK (beta channel)
        run: |
          NDK="$(grep -oP 'ndkVersion\s*=\s*"\K[^"]+' android/app/build.gradle.kts)"
          echo "installing ndk;$NDK"
          # No pipefail here: sdkmanager exits before `yes` does, `yes`
          # dies of SIGPIPE with 141, and under pipefail that sinks the
          # step even though the install worked. The directory check
          # below is what actually says whether it did.
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --channel=1 "ndk;$NDK"
          if [ ! -d "$ANDROID_HOME/ndk/$NDK" ]; then
            echo "error: ndk;$NDK is not under $ANDROID_HOME/ndk" >&2
            ls -1 "$ANDROID_HOME/ndk" 2>/dev/null >&2 || true
            exit 1
          fi

      - run: flutter pub get
      # android/gradlew and android/local.properties (which carries the
      # flutter.sdk path settings.gradle.kts reads) are not in the
      # repository: the Flutter tool writes them. --config-only writes the
      # Gradle project and builds nothing.
      - name: Generate the Gradle project
        run: flutter build apk --config-only
      # One variant is enough: the tests do not depend on the flavor. A unit
      # test task compiles the Kotlin sources and runs JUnit on the JVM — no
      # APK, no native build (the NDK is only asked for), no device.
      - name: Kotlin unit tests
        working-directory: android
        run: ./gradlew :app:testBetaDebugUnitTest
      # Every framework call in the app's own Kotlin exists at minSdk
      # (NewApi / InlinedApi only; android/app/build.gradle.kts `lint`).
      - name: Android API-level lint
        working-directory: android
        run: ./gradlew :app:lintBetaDebug
