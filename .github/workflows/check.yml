name: check

# The tests run on every pull request so the integration suite cannot rot
# again unnoticed (issue #241). Everything a checkout can run runs here:
# the formatting gate, analyze, the unit and widget suites, and the
# integration files — the WebDAV sync flow included, on a virtual display
# (`flutter test -d linux` under xvfb). The freeze harness keeps its
# hand-seeded library and skips without it (issue #363).
on:
  pull_request:
  push:
    branches:
      - main

env:
  FLUTTER_VERSION: '3.47.2'

jobs:
  check:
    name: Format, analyze and test
    runs-on: ubuntu-latest
    # Read-only: analyze and test never touch the repository or a release.
    permissions:
      contents: read
    steps:
      # Actions are pinned to a commit SHA, with the tag in a comment: a
      # moving tag is a supply-chain hole (issue #393).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The integration steps build the Linux desktop bundle (`-d linux`
      # for the WebDAV flow), which needs the same system libraries as the
      # release build, plus a virtual display: the bundle is a GTK app and
      # cannot start on a runner with no X server.
      # hunspell is the spell-check engine the app ships on Linux and
      # Windows: without the library and the two dictionaries the live
      # cases in test/unit/spell_check_test.dart skip, and the engine
      # goes unexercised everywhere but a laptop (issue #363).
      # tesseract-ocr is the distribution's OCR engine, with its English
      # model: the live case of test/unit/ocr_engine_test.dart reads a
      # rendered page through it, the path a Linux install takes (#593).
      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake git ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-13-dev \
            libayatana-appindicator3-dev libsecret-1-dev libjsoncpp-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev xvfb \
            hunspell hunspell-en-us hunspell-it tesseract-ocr tesseract-ocr-eng

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      # AGENTS.md makes formatting a precondition of a commit; this is the
      # gate that keeps it one (issue #363). --output=none only reports.
      - name: Formatting gate
        run: dart format --output=none --set-exit-if-changed lib test tool
      - run: flutter analyze --fatal-infos
      - run: flutter test
      # One file per step: files under integration_test/ share one
      # device run, and a second file in the same command never starts.
      # xvfb-run stands in for the missing display: headless, but the
      # GTK bundle still needs an X server to start.
      - name: Headless integration tests
        run: xvfb-run -a flutter test integration_test/app_boot_test.dart
      - name: Repro harness (skips without its seeded library)
        run: xvfb-run -a flutter test integration_test/template_backlink_freeze_test.dart
      # The WebDAV flow (issue #20) binds the integration_test binding and
      # drives the real app over the Linux desktop bundle: it needs a
      # device, not only a display, so the headless steps above cannot run
      # it (#363).
      - name: WebDAV sync end to end (Linux desktop)
        run: xvfb-run -a flutter test integration_test/sync_e2e_test.dart -d linux
